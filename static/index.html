<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121821;
    --panel:#1B232D;
    --panel-raised:#212B36;
    --paper:#EDEAE2;
    --paper-dim:#9CA0A6;
    --brass:#C89B3C;
    --brass-soft:#8f7440;
    --teal:#4FA88A;
    --clay:#C2694F;
    --line:rgba(200,155,60,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:24px;
    padding:32px clamp(20px,4vw,48px) 24px;
    border-bottom:1px solid var(--line);
  }
  .wordmark{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(28px,3.4vw,40px);
    letter-spacing:-0.01em;
  }
  .wordmark-sub{
    font-size:14px;
    color:var(--paper-dim);
    margin-top:4px;
    max-width:40ch;
  }
  .status-block{
    display:flex;
    align-items:center;
    gap:28px;
  }
  .status-pill{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--paper-dim);
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--clay);
    transition:background .3s;
  }
  .dot.on{background:var(--teal);}
  .balance-block{text-align:right;}
  .balance-label{font-size:12px;color:var(--paper-dim);margin-bottom:2px;}
  .balance-figure{
    font-family:'IBM Plex Mono',monospace;
    font-size:clamp(28px,3vw,36px);
    font-weight:500;
    transition:color .25s;
  }
  .balance-figure.flash-up{color:var(--teal);}
  .balance-figure.flash-down{color:var(--clay);}
  .pnl{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--paper-dim);}
  .pnl.pos{color:var(--teal);}
  .pnl.neg{color:var(--clay);}

  main{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:1px;
    background:var(--line);
    max-width:1320px;
    margin:0 auto;
  }
  @media (max-width:860px){
    main{grid-template-columns:1fr;}
  }
  .col{background:var(--ink);display:flex;flex-direction:column;gap:1px;background:var(--line);}
  .panel{
    background:var(--ink);
    padding:24px clamp(16px,3vw,28px);
  }
  .panel h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 16px;
  }
  .empty{
    color:var(--paper-dim);
    font-size:13px;
    padding:12px 0;
    border-top:1px dashed var(--line);
    margin-top:8px;
  }

  .channel-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .channel-row:last-of-type{border-bottom:none;}
  .channel-row input{accent-color:var(--brass);width:16px;height:16px;}
  .channel-name{flex:1;}

  label{
    display:block;
    font-size:12px;
    color:var(--paper-dim);
    margin:14px 0 6px;
  }
  label:first-of-type{margin-top:0;}
  input[type=number]{
    width:100%;
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    padding:9px 10px;
    border-radius:3px;
  }
  input[type=number]:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .demo-badge{
    display:inline-block;
    font-size:11px;
    padding:3px 8px;
    border-radius:3px;
    border:1px solid var(--line);
    color:var(--paper-dim);
    margin-top:4px;
  }

  button{
    background:var(--brass);
    color:var(--ink);
    border:none;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    border-radius:3px;
    cursor:pointer;
    margin-top:18px;
  }
  button:hover{background:#dcae4c;}
  button:focus-visible{outline:2px solid var(--paper);outline-offset:2px;}
  .save-msg{
    font-size:12px;
    color:var(--teal);
    margin-left:12px;
    opacity:0;
    transition:opacity .2s;
  }
  .save-msg.show{opacity:1;}
  .save-row{display:flex;align-items:center;}

  .feed-panel{padding-bottom:12px;}
  .feed{
    list-style:none;
    margin:0;
    padding:0;
    max-height:74vh;
    overflow-y:auto;
  }
  .feed li{
    display:grid;
    grid-template-columns:76px 96px 1fr;
    gap:12px;
    align-items:baseline;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .feed li:first-child{
    animation:enter .5s ease;
  }
  @keyframes enter{
    from{background:rgba(200,155,60,0.14);}
    to{background:transparent;}
  }
  .feed-time{color:var(--paper-dim);font-size:12px;}
  .feed-tag{
    font-size:11px;
    padding:2px 7px;
    border-radius:3px;
    border:1px solid var(--line);
    color:var(--paper-dim);
    justify-self:start;
    white-space:nowrap;
  }
  .feed-tag.win{color:var(--teal);border-color:var(--teal);}
  .feed-tag.loss{color:var(--clay);border-color:var(--clay);}
  .feed-tag.accent{color:var(--brass);border-color:var(--brass);}
  .feed-msg{color:var(--paper);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  @media (prefers-reduced-motion: reduce){
    .feed li:first-child{animation:none;}
    .balance-figure{transition:none;}
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="wordmark">Signal Room</div>
    <div class="wordmark-sub">Watching your Telegram channels, trading Pocket Option for you.</div>
  </div>
  <div class="status-block">
    <div class="status-pill"><span class="dot" id="dot"></span><span id="connText">Connecting…</span></div>
    <div class="balance-block">
      <div class="balance-label">Balance</div>
      <div class="balance-figure mono" id="balance">—</div>
      <div class="pnl mono" id="pnl">today —</div>
    </div>
  </div>
</header>

<main>
  <div class="col">
    <div class="panel">
      <h2>Channels</h2>
      <div id="channelList"></div>
      <div class="save-row">
        <button id="saveChannels">Save channels</button>
        <span class="save-msg" id="channelsMsg">Saved.</span>
      </div>
    </div>

    <div class="panel">
      <h2>Trading settings</h2>
      <label for="stake">Starting stake</label>
      <input type="number" id="stake" min="0" step="0.5">

      <label for="mult">Martingale multiplier</label>
      <input type="number" id="mult" min="1" step="0.1">

      <label for="maxLevel">Max martingale level</label>
      <input type="number" id="maxLevel" min="0" step="1">

      <label for="maxLoss">Max daily loss (leave blank for no cap)</label>
      <input type="number" id="maxLoss" min="0" step="1">

      <div style="margin-top:14px;">
        <span class="demo-badge" id="demoBadge">Mode: —</span>
      </div>

      <div class="save-row">
        <button id="saveSettings">Save settings</button>
        <span class="save-msg" id="settingsMsg">Saved.</span>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="panel feed-panel">
      <h2>Live feed</h2>
      <ul class="feed" id="feed"></ul>
      <div class="empty" id="feedEmpty" style="display:none;">Nothing yet. Signals will appear here as they come in.</div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

function fmtTime(ts){
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

function tagClass(evt){
  if (evt.kind === 'trade_result' || evt.kind === 'sequence_done'){
    if (evt.won === true) return 'win';
    if (evt.won === false) return 'loss';
  }
  if (evt.kind === 'signal_detected' || evt.kind === 'trade_opened') return 'accent';
  return '';
}

function tagLabel(kind){
  return ({
    connection: 'connection',
    balance: 'balance',
    signal_detected: 'signal',
    trade_opened: 'trade',
    trade_result: 'result',
    sequence_done: 'done',
    skipped: 'skipped',
    channels_updated: 'channels',
    settings_updated: 'settings',
  })[kind] || kind;
}

function prependEvent(evt){
  $('feedEmpty').style.display = 'none';
  const li = document.createElement('li');
  li.innerHTML = `
    <span class="feed-time mono">${fmtTime(evt.ts)}</span>
    <span class="feed-tag ${tagClass(evt)}">${tagLabel(evt.kind)}</span>
    <span class="feed-msg">${evt.message}</span>
  `;
  const feed = $('feed');
  feed.insertBefore(li, feed.firstChild);
  while (feed.children.length > 200) feed.removeChild(feed.lastChild);
}

function renderChannels(channels){
  const el = $('channelList');
  if (!channels || channels.length === 0){
    el.innerHTML = '<div class="empty">No channels loaded yet. They\'ll appear here once Telegram connects.</div>';
    return;
  }
  el.innerHTML = channels.map(c => `
    <label class="channel-row">
      <input type="checkbox" value="${c.id}" ${c.selected ? 'checked' : ''}>
      <span class="channel-name">${c.name}</span>
    </label>
  `).join('');
}

function renderSettings(s){
  if (!s) return;
  $('stake').value = s.starting_stake;
  $('mult').value = s.martingale_multiplier;
  $('maxLevel').value = s.max_martingale_level;
  $('maxLoss').value = s.max_daily_loss ?? '';
  $('demoBadge').textContent = 'Mode: ' + (s.is_demo ? 'Demo' : 'Live') + ' (change in .env, restart to switch)';
}

function renderHeader(snapshot){
  $('dot').classList.toggle('on', snapshot.connected);
  $('connText').textContent = snapshot.connected ? 'Connected' : 'Disconnected';
  if (snapshot.balance !== null && snapshot.balance !== undefined){
    $('balance').textContent = Number(snapshot.balance).toFixed(2);
  }
  const pnlEl = $('pnl');
  const pnl = snapshot.daily_pnl ?? 0;
  pnlEl.textContent = 'today ' + (pnl >= 0 ? '+' : '') + pnl.toFixed(2);
  pnlEl.classList.toggle('pos', pnl > 0);
  pnlEl.classList.toggle('neg', pnl < 0);
}

function flashBalance(up){
  const el = $('balance');
  el.classList.remove('flash-up','flash-down');
  void el.offsetWidth; // restart animation
  el.classList.add(up ? 'flash-up' : 'flash-down');
  setTimeout(() => el.classList.remove('flash-up','flash-down'), 1200);
}

async function loadInitial(){
  const res = await fetch('/api/state');
  const snap = await res.json();
  renderHeader(snap);
  renderChannels(snap.channels);
  renderSettings(snap.settings);
  const feed = $('feed');
  feed.innerHTML = '';
  if (!snap.events || snap.events.length === 0){
    $('feedEmpty').style.display = 'block';
  } else {
    [...snap.events].reverse().forEach(prependEvent);
  }
}

function connectWS(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  let lastBalance = null;

  ws.onmessage = (msg) => {
    const payload = JSON.parse(msg.data);
    if (payload.type === 'snapshot'){
      renderHeader(payload.data);
      renderChannels(payload.data.channels);
      renderSettings(payload.data.settings);
      lastBalance = payload.data.balance;
    } else if (payload.type === 'event'){
      const evt = payload.data;
      prependEvent(evt);
      if (evt.kind === 'connection') { $('dot').classList.add('on'); $('connText').textContent = 'Connected'; }
      if (evt.kind === 'balance' && typeof evt.message === 'string'){
        const match = evt.message.match(/[-\d.]+$/);
        if (match){
          const newBal = parseFloat(match[0]);
          if (!isNaN(newBal)){
            if (lastBalance !== null) flashBalance(newBal >= lastBalance);
            lastBalance = newBal;
            $('balance').textContent = newBal.toFixed(2);
          }
        }
      }
      if (evt.kind === 'sequence_done' && typeof evt.pnl === 'number'){
        fetch('/api/state').then(r => r.json()).then(renderHeader);
      }
    }
  };
  ws.onclose = () => {
    $('dot').classList.remove('on');
    $('connText').textContent = 'Disconnected — retrying…';
    setTimeout(connectWS, 3000);
  };
}

$('saveChannels').addEventListener('click', async () => {
  const ids = [...document.querySelectorAll('#channelList input[type=checkbox]:checked')].map(cb => Number(cb.value));
  await fetch('/api/channels', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({channel_ids: ids}),
  });
  const msg = $('channelsMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 1800);
});

$('saveSettings').addEventListener('click', async () => {
  const body = {
    starting_stake: parseFloat($('stake').value),
    martingale_multiplier: parseFloat($('mult').value),
    max_martingale_level: parseInt($('maxLevel').value, 10),
    max_daily_loss: $('maxLoss').value === '' ? null : parseFloat($('maxLoss').value),
  };
  await fetch('/api/settings', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  const msg = $('settingsMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 1800);
});

loadInitial();
connectWS();
</script>
</body>
</html>
